:root[data-theme="dark"]{--bg:#171513;--card:#201d1a;--ink:#f2ece4;--mute:#9b9288;--line:#35302b;--acc:#e8806a;--accsoft:#3a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:36px 22px 48px}

.date{text-align:center;font-size:26px;margin:0 0 30px;text-transform:capitalize}

#main-btn:active{transform:scale(.98)}

.msg{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:10px;animation:in .5s ease}
.msg small{color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.msg p{margin:0;font-size:20px;line-height:1.5}
.msg.locked p{font-size:17px;color:var(--mute)}
.count{font-variant-numeric:tabular-nums;color:var(--acc);font-size:22px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;color:var(--mute);margin:36px 0 12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.nav{display:flex;align-items:center;justify-content:space-between;margin:36px 0 12px}.nav h2{margin:0;text-transform:capitalize}.nav button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}.wd{text-align:center;font-size:11px;color:var(--mute);padding-bottom:2px}.day.off{opacity:.25;cursor:default}
.day{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;position:relative}
.day.open{background:var(--accsoft);border-color:transparent}
.day.today{border:2px solid var(--acc);font-weight:700}
.day.locked{color:var(--mute);opacity:.6}
.day.locked::after{content:"·";position:absolute;bottom:4px;left:0;right:0;font-size:14px}
.from{text-align:center;color:var(--mute);font-size:13px;font-style:italic;margin:0 0 10px}.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:30px}
</style>
</head>

const DAY = 864e5;
const $ = id => document.getElementById(id);
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const startOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const q = new URLSearchParams(location.search).get("fecha");
const now = () => (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) ? new Date(parse(q).getTime() + (Date.now() - startOf(new Date()).getTime())) : new Date();
const start = parse(START);
const N = MESSAGES.length;
const dayIndex = () => Math.round((startOf(now()) - start) / DAY); // 0 = día 1
const unlockAt = i => new Date(start.getTime() + i * DAY);

let opened = {};
try { opened = JSON.parse(localStorage.getItem("capsula:" + START) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("capsula:" + START, JSON.stringify(opened)); } catch (e) {} };

let timer = null;
let view = null;
function fmtCount(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = n => String(n).padStart(2, "0");
  return (d ? d + "d " : "") + p(h) + ":" + p(m) + ":" + p(x);
}
function showMessage(i) {
  clearInterval(timer);
  opened[i] = true; save();
  $("out").innerHTML = '<div class="msg"><small>Día ' + (i + 1) + '</small><p></p></div>';
  $("out").querySelector("p").textContent = MESSAGES[i];
  render();
}
function showLocked(i) {
  clearInterval(timer);
  const target = unlockAt(i);
  $("out").innerHTML = '<div class="msg locked"><small>Día ' + (i + 1) + '</small><p>Todavía no es momento, paciencia 🌙</p><div class="count"></div></div>';
  const c = $("out").querySelector(".count");
  const tick = () => {
    const left = target - now();
    if (left <= 0) { clearInterval(timer); render(); showMessage(i); return; }
    c.textContent = fmtCount(left);
  };
  tick(); timer = setInterval(tick, 1000);
}
function openDay(i) {
  if (i <= dayIndex()) showMessage(i); else showLocked(i);
}
function render() {

  if(!view){const t0=idx<0?start:startOf(now());view=new Date(t0.getFullYear(),t0.getMonth(),1);}
  $("mh").textContent=view.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
  $("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};
  $("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};
  const g=$("grid");g.innerHTML="";
  ["L","M","M","J","V","S","D"].forEach(w=>{const s=document.createElement("span");s.className="wd";s.textContent=w;g.appendChild(s);});
  const lead=(view.getDay()+6)%7;
  for(let k=0;k<lead;k++)g.appendChild(document.createElement("span"));
  const dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();

    b.textContent=dd;
    if(i<0||i>=N){b.className="day off";b.disabled=true;}
    else{b.className="day"+(i===idx?" today":"")+(i>idx?" locked":"")+(opened[i]?" open":"");b.setAttribute("aria-label","Día "+(i+1)+(i>idx?" (bloqueado)":""));b.onclick=()=>openDay(i);}
    g.appendChild(b);
  }
  const done = Object.keys(opened).length;
  $("foot").textContent = done + " de " + N + " mensajes abiertos";
}
$("from").textContent = (PARA ? "Para " + PARA + ", " : "") + "hecho con cariño por " + DE;
render();
</script>
</body>
</html>
