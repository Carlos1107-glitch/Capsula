<style>
:root{--bg:#f6f1fd;--card:#fff;--ink:#2a2140;--mute:#7d7394;--line:#e4daf4;--acc:#7b4fd6;--accsoft:#ece3fb;--glow:#e3d4ff;--acc2:#d062c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d1f;--card:#1c1530;--ink:#f3edff;--mute:#a99dc4;--line:#33284f;--acc:#a98bff;--accsoft:#35285a;--glow:#3a2670;--acc2:#e07ad0}}
:root[data-theme="dark"]{--bg:#120d1f;--card:#1c1530;--ink:#f3edff;--mute:#a99dc4;--line:#33284f;--acc:#a98bff;--accsoft:#35285a;--glow:#3a2670;--acc2:#e07ad0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:36px 22px 48px}
h1{font-size:15px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;color:var(--mute);text-align:center;margin:0 0 6px}
.date{text-align:center;font-size:26px;margin:0 0 30px;text-transform:capitalize}
#main-btn{display:block;width:100%;padding:22px;border:0;border-radius:18px;background:var(--acc);color:#fff;font:inherit;font-size:20px;cursor:pointer;transition:transform .15s,opacity .15s}
#main-btn:active{transform:scale(.98)}
#main-btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:10px;animation:in .5s ease}
.msg small{color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.msg p{margin:0;font-size:20px;line-height:1.5}
.msg.locked p{font-size:17px;color:var(--mute)}
.count{font-variant-numeric:tabular-nums;color:var(--acc);font-size:22px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;color:var(--mute);margin:36px 0 12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.nav{display:flex;align-items:center;justify-content:space-between;margin:36px 0 12px}.nav h2{margin:0;text-transform:capitalize}.nav button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}.wd{text-align:center;font-size:11px;color:var(--mute);padding-bottom:2px}.day.off{opacity:.25;cursor:default}
.day{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;position:relative}
.day.open{background:var(--accsoft);border-color:transparent}
.day.today{border:2px solid var(--acc);font-weight:700}
.day.locked{color:var(--mute);opacity:.6}
.day.locked::after{content:"·";position:absolute;bottom:4px;left:0;right:0;font-size:14px}
.from{text-align:center;color:var(--mute);font-size:13px;font-style:italic;margin:0 0 10px}.notif{display:block;margin:26px auto 0;background:none;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 18px;font:inherit;font-size:14px;cursor:pointer}.notif[hidden]{display:none}.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.heart{position:absolute;bottom:-40px;color:var(--acc);opacity:0;animation:floaty linear infinite}
@keyframes floaty{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.3}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart{animation:none;opacity:.12}}
main{position:relative;z-index:1}
#cover{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s}
#cover.hide{opacity:0;pointer-events:none}
#cover .hearts{position:absolute}
.cin{position:relative;z-index:1}
.c-sub{margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.c-title{margin:10px 0 0;font-size:34px}
.c-big{font-size:56px;margin:18px 0 26px}
#enter{padding:16px 46px;border:0;border-radius:999px;background:var(--acc);color:#fff;font:inherit;font-size:19px;cursor:pointer}
#music{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:11;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
#music[hidden]{display:none}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:30px}

/* ===== Estilo morado ===== */
body{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;background:var(--bg);background:radial-gradient(900px 520px at 50% -8%,var(--glow),transparent 70%),var(--bg);background-attachment:fixed}
main{animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{letter-spacing:.32em}
.date{font-family:'Great Vibes','Cormorant Garamond',cursive;font-size:46px;font-weight:400;text-transform:none;margin-bottom:26px;line-height:1.1}
#main-btn,#enter{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 12px 30px -12px var(--acc);font-weight:600;letter-spacing:.02em}
#main-btn{font-size:22px;border-radius:20px}
.msg{background:var(--card);background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 24px 50px -28px var(--acc)}
.msg p{font-size:24px;font-style:italic}
.day{font-family:inherit;font-size:17px;background:var(--card);background:color-mix(in srgb,var(--card) 70%,transparent)}
.day.open{background:var(--accsoft)}
.day.today{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft),0 0 16px -2px var(--acc)}
.heart:nth-child(3n){color:var(--acc2)}
#cover{background:radial-gradient(700px 520px at 50% 38%,var(--glow),var(--bg) 72%)}
.c-sub{letter-spacing:.32em}
.c-title{font-family:'Great Vibes','Cormorant Garamond',cursive;font-size:58px;font-weight:400;margin:6px 0 0;line-height:1.1}
.c-big{animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
#enter{font-size:21px}

/* ===== Fotos y álbum ===== */
.ph{margin-top:6px}
.ph img{width:100%;border-radius:12px;display:block;margin-bottom:12px}
.phrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.phbtn{background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:15px;border-radius:12px;padding:9px 14px;cursor:pointer}
#album,#cartas{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
#album[hidden],#cartas[hidden]{display:none}
.ahead{max-width:460px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between}
.ahead h2{margin:0;font-family:'Great Vibes',cursive;font-size:40px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
#aclose,#cclose{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.acard{max-width:460px;margin:0 auto 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 40px -28px var(--acc)}
.acard img{width:100%;display:block}
.acard div{padding:16px 18px}
.acard small{color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.acard p{font-style:italic;font-size:21px;margin:6px 0 0;line-height:1.45}
.aempty{max-width:460px;margin:40px auto;text-align:center;color:var(--mute)}
.song{display:inline-block;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:16px;margin:2px 0 8px}
.acard .song{margin-top:10px}
.cbtn{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:21px;padding:18px;cursor:pointer}
#clist .acard div{animation:rise .5s ease both}

<div class="hearts" id="hearts"></div>
<div id="cover"><div class="hearts" id="chearts"></div><div class="cin"><p class="c-sub">Una cápsula hecha para ti</p><p class="c-title" id="c-title"></p><div class="c-big">💜</div><button id="enter">Entrar</button></div></div>

<button id="music" hidden aria-label="Música">🎵</button>
<main>

  <button class="notif" id="cartas-btn">💌 Ábrela cuando…</button>
  <button class="notif" id="album-btn">📖 Mi álbum de recuerdos</button>
  <button class="notif" id="notif-btn" hidden>🔔 Activar recordatorio diario</button>
  <p class="foot" id="foot"></p>
</main>

  const idx = dayIndex();
  $("today").textContent = now().toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
  const btn = $("main-btn");
  if (idx < 0) { btn.textContent = "Aún no empieza"; btn.disabled = false; btn.onclick = () => showLocked(0); }
  else if (idx >= N) { btn.textContent = "Ver el último mensaje"; btn.disabled = false; btn.onclick = () => showMessage(N - 1); }
  else { btn.textContent = opened[idx] ? "Ver el mensaje de hoy" : "¿Qué hay hoy?"; btn.disabled = false; btn.onclick = () => showMessage(idx); }
  if(!view){const t0=idx<0?start:startOf(now());view=new Date(t0.getFullYear(),t0.getMonth(),1);}
  $("mh").textContent=view.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
  $("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};
  $("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};
  const g=$("grid");g.innerHTML="";
  ["L","M","M","J","V","S","D"].forEach(w=>{const s=document.createElement("span");s.className="wd";s.textContent=w;g.appendChild(s);});
  const lead=(view.getDay()+6)%7;
  for(let k=0;k<lead;k++)g.appendChild(document.createElement("span"));
  const dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  for(let dd=1;dd<=dim;dd++){
    const date=new Date(view.getFullYear(),view.getMonth(),dd);
    const i=Math.round((date-start)/DAY);
    const b=document.createElement("button");
    b.textContent=dd;
    if(i<0||i>=N){b.className="day off";b.disabled=true;}
    else{b.className="day"+(i===idx?" today":"")+(i>idx?" locked":"")+(opened[i]?" open":"");b.setAttribute("aria-label","Día "+(i+1)+(i>idx?" (bloqueado)":""));b.onclick=()=>openDay(i);}
    g.appendChild(b);
  }
  const done = Object.keys(opened).length;
  $("foot").textContent = done + " de " + N + " mensajes abiertos";
}
$("from").textContent = (PARA ? "Para " + PARA + ", " : "") + "hecho con cariño por " + DE;
render();

// ====== PORTADA, CORAZONES Y MÚSICA ======
// Lista de canciones (suenan en este orden y vuelven a empezar). Sube los mp3 al repositorio con estos nombres,
// o cambia/agrega nombres aquí. Si alguno no existe, se salta.
const CANCIONES = ["musica1.mp3", "musica2.mp3", "musica3.mp3"];
function makeHearts(el, n) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement("span");
    h.className = "heart"; h.textContent = "♥";
    h.style.left = Math.random() * 100 + "%";
    h.style.fontSize = (14 + Math.random() * 26) + "px";
    h.style.animationDuration = (9 + Math.random() * 10) + "s";
    h.style.animationDelay = (-Math.random() * 15) + "s";
    el.appendChild(h);
  }
}
makeHearts($("hearts"), 16); makeHearts($("chearts"), 26);
$("c-title").textContent = PARA ? "Para " + PARA : "Para ti";
const audio = new Audio(); audio.volume = 0.6;
let idx = 0, fails = 0, playing = false;
const setSrc = () => { audio.src = CANCIONES[idx]; };
const nextSong = () => { idx = (idx + 1) % CANCIONES.length; setSrc(); };
audio.addEventListener("playing", () => { fails = 0; });
audio.addEventListener("ended", () => { nextSong(); audio.play().catch(() => {}); });
audio.addEventListener("error", () => {
  fails++;
  if (fails >= CANCIONES.length) { $("music").hidden = true; playing = false; return; }
  nextSong(); if (playing) audio.play().catch(() => {});
});
setSrc();
function setMusic(on) {
  if (on) { playing = true; audio.play().catch(e => { if (e && e.name === "NotAllowedError") playing = false; }); $("music").style.opacity = 1; }
  else { playing = false; audio.pause(); $("music").style.opacity = 0.45; }
}
$("enter").onclick = () => {
  $("cover").classList.add("hide");
  $("music").hidden = false; setMusic(true);
  setTimeout(() => { $("cover").style.display = "none"; }, 700);
};
$("music").onclick = () => setMusic(!playing);

// ====== FOTOS Y ÁLBUM (se guardan solo en el celular de quien usa la app) ======
let db = null;
const dbReady = new Promise(res => {
  try {
    const r = indexedDB.open("capsula-fotos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("fotos", { keyPath: "day" });
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => res(null);
  } catch (e) { res(null); }
});
const fotos = {};
async function loadFotos() {
  const d = await dbReady; if (!d) return;
  await new Promise(res => {
    try {
      const q = d.transaction("fotos").objectStore("fotos").getAll();
      q.onsuccess = () => { q.result.forEach(f => { fotos[f.day] = f.data; }); res(); };
      q.onerror = () => res();
    } catch (e) { res(); }
  });
}
function savePhoto(day, data) { fotos[day] = data; if (db) try { db.transaction("fotos", "readwrite").objectStore("fotos").put({ day, data }); } catch (e) {} }
function delPhoto(day) { delete fotos[day]; if (db) try { db.transaction("fotos", "readwrite").objectStore("fotos").delete(day); } catch (e) {} }
function resize(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = rej; img.src = url;
  });
}
function pick(i) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try { savePhoto(i, await resize(f)); } catch (e) { alert("No pude cargar esa foto, prueba con otra."); }
    drawPhoto(i);
  };
  inp.click();
}
function drawPhoto(i) {
  const box = $("ph"); if (!box) return;
  box.innerHTML = "";
  if (fotos[i]) { const im = document.createElement("img"); im.src = fotos[i]; im.alt = "Tu foto del día " + (i + 1); box.appendChild(im); }
  const row = document.createElement("div"); row.className = "phrow";
  const add = document.createElement("button"); add.className = "phbtn";
  add.textContent = fotos[i] ? "Cambiar foto" : "📷 Agregar una foto de este día";
  add.onclick = () => pick(i); row.appendChild(add);
  if (fotos[i]) {
    const del = document.createElement("button"); del.className = "phbtn"; del.textContent = "Quitar";
    del.onclick = () => { delPhoto(i); drawPhoto(i); }; row.appendChild(del);
  }
  box.appendChild(row);
}
function openAlbum() {
  const list = $("alist"); list.innerHTML = "";
  const top = Math.min(dayIndex(), N - 1); let n = 0;
  for (let i = top; i >= 0; i--) {
    if (!opened[i] && !fotos[i]) continue;
    n++;
    const card = document.createElement("div"); card.className = "acard";
    if (fotos[i]) { const im = document.createElement("img"); im.src = fotos[i]; im.alt = "Foto del día " + (i + 1); card.appendChild(im); }
    const body = document.createElement("div");
    const sm = document.createElement("small");
    sm.textContent = "Día " + (i + 1) + " · " + unlockAt(i).toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
    const p = document.createElement("p"); p.textContent = MESSAGES[i];
    body.appendChild(sm); body.appendChild(p); { const sg = songLink(i); if (sg) body.appendChild(sg); } card.appendChild(body); list.appendChild(card);
  }
  if (!n) { const e = document.createElement("p"); e.className = "aempty"; e.textContent = "Aún no hay recuerdos. Abre el mensaje de hoy y agrega una foto."; list.appendChild(e); }
  $("album").hidden = false; $("album").scrollTop = 0;
}
$("album-btn").onclick = openAlbum;
$("aclose").onclick = () => { $("album").hidden = true; };
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
loadFotos();

function songLink(i) {
  const s = CANCION_DIA[i + 1]; if (!s) return null;
  const q = typeof s === "string" ? { t: s } : s;
  const a = document.createElement("a");
  a.className = "song"; a.target = "_blank"; a.rel = "noopener";
  a.href = q.url || ("https://www.youtube.com/results?search_query=" + encodeURIComponent(q.t));
  a.textContent = "🎵 Canción de hoy: " + q.t;
  return a;
}
